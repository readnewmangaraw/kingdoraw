<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="siteDescription" name="description" content="">
  <title id="siteTitle">Kingdom</title>
  <link rel="stylesheet" href="style.css">
  <script src="site.config.js"></script>
</head>
<body>
<script>
(function () {
  const c = window.KINGDOM_CONFIG || {};

  document.title =
    c.siteNameJa ||
    c.siteName ||
    "Manga";

  const meta =
    document.getElementById("siteDescription");

  if (meta) {
    meta.setAttribute(
      "content",
      c.descriptionJa ||
      ""
    );
  }

  document.querySelectorAll(
    "[data-site-name]"
  ).forEach(el => {
    el.textContent =
      c.siteNameJa ||
      c.siteName ||
      "Manga";
  });

})();
</script>

<header class="site-header">
  <div class="container header-inner">
    <a href="./" class="logo">KINGDOM<span>RAW</span></a>

    <nav class="nav">
      <a href="./">Home</a>
      <a href="#latest">Latest</a>
      <a href="#languages">Languages</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container">
      <p class="hero-label">MANGA READER</p>
      <h1>Kingdom Raw Manga</h1>
      <p class="hero-text">
        Read the latest manga chapters online.
      </p>
    </div>
  </section>

  <section id="latest" class="chapters-section">
    <div class="container">
      <div class="section-heading">
        <div>
          <span class="section-kicker">LATEST</span>
          <h2>Latest Chapters</h2>
        </div>

        <div id="languages" class="language-filter">
          <button class="filter-btn active" data-language="all">All</button>
          <button class="filter-btn" data-language="English">English</button>
          <button class="filter-btn" data-language="Japanese">日本語</button>
        </div>
      </div>

      <div id="chapters" class="chapters-grid">
        <div class="loading">Loading chapters...</div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Kingdom Raw Manga</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
