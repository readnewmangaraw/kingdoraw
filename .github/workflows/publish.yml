name: Publish Manga Chapter

on:
  repository_dispatch:
    types: [publish-chapter]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create publisher data
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > /tmp/payload.json
          node publisher/publish.js

      - name: Commit published chapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ images/
          git diff --cached --quiet || git commit -m "Publish manga chapter"
          git push
